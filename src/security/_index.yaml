version: "1.0"
namespace: butschster.tui_desktop.security

# Права разделены на три, а не слиты в одну «всё можно»: композитору нужно
# порождать процессы и запускать программы, командному каналу — только
# найти композитор и заговорить с ним, а доступ к ручкам выдаёт приложение.

entries:
  # butschster.tui_desktop.security:desktop_runtime
  - name: desktop_runtime
    kind: security.policy
    meta:
      comment: Права композитора и окон — порождать процессы с грантом на viewport, гасить их и запускать программы под PTY.
    policy:
      actions:
        - process.context
        - process.spawn
        - process.spawn.monitored
        - process.monitor
        - process.host
        - process.terminate
        - process.send
        - process.registry
        - process.registry.register
        - process.registry.unregister
        - exec.get
        - exec.run
        # Каталог окон приложения читается из реестра по meta.type.
        - registry.get
        - registry.find
      resources: "*"
      effect: allow

  # butschster.tui_desktop.security:desktop_command_channel
  - name: desktop_command_channel
    kind: security.policy
    meta:
      comment: Права ручек командного канала — найти композитор по имени и послать ему команду. Ни порождения процессов, ни запуска программ здесь нет намеренно.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # butschster.tui_desktop.security:desktop_endpoint_access
  - name: desktop_endpoint_access
    kind: security.policy
    meta:
      comment: Аутентифицированные пользователи приложения могут обращаться к ручкам десктопа.
    groups: []
    policy:
      resources:
        - butschster.tui_desktop.api:*
      actions: access
      effect: allow

  # butschster.tui_desktop.security:user_security_scope
  - name: user_security_scope
    kind: ns.requirement
    meta:
      comment: Группа безопасности приложения, которой открыт доступ к ручкам десктопа.
    targets:
      - entry: butschster.tui_desktop.security:desktop_endpoint_access
        path: ".groups +="
