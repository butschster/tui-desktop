version: "1.0"
namespace: app

# Standalone harness for butschster/tui-desktop. Provides the host resources the
# boot needs (app:db, app:processes, gateway + api router, env storage, a
# permissive actor scope) and wires them through wippy/bootloader so the
# co-located *_test.lua suites run in isolation. The router exists only so the
# endpoint entries resolve; the command channel is covered as registry shape.
#
# Этот же харнесс поднимает десктоп руками, без приложения:
#   cd test && wippy run --host butschster.tui_desktop:terminal desktop
# Harness-only; excluded from publish via the module wippy.yaml.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: TUI Desktop Test Harness }

  - name: storage_test
    kind: function.lua
    meta:
      type: test
      comment: Хранилище окон переживает круг «сохранил — прочитал — удалил», а сборка записи реестра не пускает чужие модули.
      group: TUI Desktop
      suite: butschster_tui_desktop
    source: file://storage_test.lua
    modules: [sql, env, json, registry]
    imports:
      test: wippy.test:test
      repo: butschster.tui_desktop.persist:repo
      apps: butschster.tui_desktop.persist:apps
    method: run

  - name: wiring_test
    kind: function.lua
    meta:
      type: test
      comment: Хосты, процессы, ручки и политики существуют и ссылаются друг на друга; лог на терминальном хосте заглушен, у командного канала нет права порождать процессы.
      group: TUI Desktop
      suite: butschster_tui_desktop
    source: file://wiring_test.lua
    modules: [registry, process, channel, time, tty]
    imports:
      test: wippy.test:test
      programs: butschster.tui_desktop.desktop:programs
      window_api: butschster.tui_desktop.desktop:window_api
    method: run

  # Окно-заглушка в двух видах: с модулем ctx и без него. Двумя записями, а не
  # параметром, потому что проверяется именно объявление записи: модуль окна
  # выбирает не код окна, а тот, кто его объявил.
  - name: window_probe
    kind: process.lua
    meta:
      comment: Окно-заглушка, объявившая ctx — сообщает имя своего композитора.
    source: file://window_probe.lua
    method: main
    modules: [process, ctx]
    imports:
      desktop: butschster.tui_desktop.desktop:window_api

  # Окно, которое спрашивает композитор. Режим приезжает аргументом: «naive» —
  # цикл, съедающий чужое из inbox, «ask» — примитив ожидания из библиотеки.
  - name: ask_probe
    kind: process.lua
    meta:
      comment: Окно-заглушка, задающая композитору вопрос; проверяет, переживает ли ожидание чужую команду.
    source: file://ask_probe.lua
    method: main
    modules: [process, channel, time]
    imports:
      desktop: butschster.tui_desktop.desktop:window_api

  - name: window_probe_bare
    kind: process.lua
    meta:
      comment: Окно-заглушка без ctx — запись, написанная до того, как имя композитора начали передавать.
    source: file://window_probe.lua
    method: main
    modules: [process]
    imports:
      desktop: butschster.tui_desktop.desktop:window_api

  # Композитор целиком, на viewport, выданном тестом. Модули те же, что у
  # штатной оболочки: механика зовётся ровно так же, как в жизни.
  - name: test_composer
    kind: process.lua
    meta:
      comment: Композитор на viewport теста — родство окон проверяется на живом, а не по форме реестра.
    source: file://test_composer.lua
    method: main
    modules: [channel, env, json, logger, process, registry, sql, time, tty]
    imports:
      library: butschster.tui_desktop.desktop:library
      chrome: butschster.tui_desktop.desktop:chrome

  - name: dialog_probe
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Окно с диалогом
      comment: Окно, которое открывает свой диалог и обычную программу рядом.
    source: file://dialog_probe.lua
    method: main
    modules: [channel, process, time]
    imports:
      desktop: butschster.tui_desktop.desktop:window_api

  - name: idle_window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Просто окно
      in_menu: false
      comment: Окно без кадра и ввода — существует, пока его не закроют.
    source: file://idle_window.lua
    method: main
    modules: [channel, time]

  - name: db
    kind: db.sql.sqlite
    meta:
      comment: In-memory database — харнесс его не использует, но загрузчик просит ресурс.
    file: ":memory:"

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  # The endpoint and static entries resolve against these resources at boot;
  # no suite calls them over HTTP — the wiring suite checks registry shape.
  - name: gateway
    kind: http.service
    addr: :19219
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      server: gateway
    prefix: /api

  - name: user
    kind: security.policy
    meta:
      comment: Permissive actor scope for the suites.
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # The harness source is the lock root. Its .wippy.yaml replaces the declared
  # butschster/tui-desktop dependency with ../ so the module's canonical source and
  # colocated tests load directly without a lock-file replacement.

  # Харнесс тестирует модуль, значит зависит от него. Замена в .wippy.yaml
  # подставляет сюда рабочую копию из ../, поэтому исходник и колокейтед
  # тесты грузятся напрямую, без публикации.
  - name: tui_desktop_harness.dep.module
    version: "*"
    kind: ns.dependency
    meta:
      comment: Модуль под тестом; источник подменяется на ../ в .wippy.yaml.
    component: "butschster/tui-desktop"
    parameters:
      - name: butschster.tui_desktop:api_router
        value: app:api

  - name: tui_desktop_harness.dep.migration
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host binding for the migration dependency used by the module under test.
    component: "wippy/migration"
    parameters:
      - name: wippy.migration:app_db
        value: app:db

  - name: tui_desktop_harness.dep.security
    version: "*"
    kind: ns.dependency
    meta:
      comment: Platform security groups (wippy.security:process) that give host-managed services their policy scope under strict mode.
    component: "wippy/security"

  - name: tui_desktop_harness.dep.bootloader
    version: "*"
    kind: ns.dependency
    meta:
      comment: Host wiring for the standalone test harness.
    component: "wippy/bootloader"
    parameters:
      - name: wippy.bootloader:application_host
        value: app:processes
      - name: wippy.bootloader:env_storage
        value: app:env_storage
